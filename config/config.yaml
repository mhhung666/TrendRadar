app:
  version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version"
  show_version_update: true # 控制顯示版本更新提示，如果 false，則不接受新版本提示

crawler:
  request_interval: 1000 # 請求間隔(毫秒)
  enable_crawler: true # 是否啓用爬取新聞功能，如果 false，則直接停止程序
  use_proxy: false # 是否啓用代理，false 時爲關閉
  default_proxy: "http://127.0.0.1:10086"

# 🔸 daily（當日彙總模式）
#   • 推送時機：按時推送(默認每小時推送一次)
#   • 顯示內容：當日所有匹配新聞 + 新增新聞區域
#   • 適用場景：日報總結、全面瞭解當日熱點趨勢
#
# 🔸 current（當前榜單模式）
#   • 推送時機：按時推送(默認每小時推送一次)
#   • 顯示內容：當前榜單匹配新聞 + 新增新聞區域
#   • 適用場景：實時熱點追蹤、瞭解當前最火的內容
#
# 🔸 incremental（增量監控模式）
#   • 推送時機：有新增才推送
#   • 顯示內容：新出現的匹配頻率詞新聞
#   • 適用場景：避免重複信息干擾

# 推送模式選擇
report:
  mode: "daily" # 可選: "daily"|"incremental"|"current"
  rank_threshold: 5 # 排名高亮閾值
  sort_by_position_first: false # 排序優先級：true=先按配置位置排序，false=先按熱點條數排序
  max_news_per_keyword: 0 # 每個關鍵詞最大顯示數量，0=不限制

notification:
  enable_notification: true # 是否啓用通知功能，如果 false，則不發送手機通知
  message_batch_size: 4000 # 消息分批大小（字節）(這個配置別動)
  dingtalk_batch_size: 20000 # 釘釘消息分批大小（字節）(這個配置也別動)
  feishu_batch_size: 29000 # 飛書消息分批大小（字節）
  bark_batch_size: 3600 # Bark消息分批大小（字節）
  slack_batch_size: 4000 # Slack消息分批大小（字節）
  batch_send_interval: 3 # 批次發送間隔（秒）
  feishu_message_separator: "━━━━━━━━━━━━━━━━━━━" # feishu 消息分割線

  # 🕐 推送時間窗口控制（可選功能）
  # 用途：限制推送的時間範圍，避免非工作時間打擾
  # 適用場景：
  #   - 只想在工作日白天接收推送（如 09:00-18:00）
  #   - 希望在晚上固定時間收到彙總（如 20:00-22:00）
  push_window:
    enabled: false  # 是否啓用推送時間窗口控制，默認關閉
    # 注意：GitHub Actions 執行時間不穩定，時間範圍建議至少留足 2 小時
    # 如果想要精準的定時推送，建議使用 Docker 部署在個人服務器上
    time_range:
      start: "20:00"  # 推送時間窗口開始（北京時間）
      end: "22:00"    # 推送時間窗口結束（北京時間）
    once_per_day: true  # 每天在時間窗口內只推送一次，如果 false，則窗口內每次執行都推送
    push_record_retention_days: 7  # 推送記錄保留天數

  # ⚠️⚠️⚠️ 重要安全警告 / IMPORTANT SECURITY WARNING ⚠️⚠️⚠️
  #
  # 🔴 請務必妥善保管好 webhooks，不要公開!!!
  # 🔴 如果你以 fork 的方式將本項目部署在 GitHub 上，請勿在下面填寫任何 webhooks
  # 🔴 而是將 webhooks 填入 GitHub Secret（Settings → Secrets and variables → Actions）
  # 🔴 否則：
  #    - 輕則：手機上收到大量垃圾廣告推送
  #    - 重則：webhook 被濫用造成嚴重安全隱患（如惡意消息轟炸、釣魚鏈接等）
  #
  # 🔴 NEVER expose webhooks publicly!!!
  # 🔴 If deploying via GitHub fork, DO NOT fill webhooks below
  # 🔴 Instead, add them to GitHub Secrets (Settings → Secrets and variables → Actions)
  # 🔴 Consequences of exposure:
  #    - Minor: Spam notifications flooding your devices
  #    - Severe: Webhook abuse leading to security incidents (malicious messages, phishing links, etc.)
  #
  webhooks:
    feishu_url: "" # 飛書機器人的 webhook URL
    dingtalk_url: "" # 釘釘機器人的 webhook URL
    wework_url: "" # 企業微信機器人的 webhook URL
    wework_msg_type: "markdown" # 企業微信消息類型：markdown(羣機器人) 或 text(個人微信應用)
    telegram_bot_token: "" # Telegram Bot Token
    telegram_chat_id: "" # Telegram Chat ID
    email_from: "" # 發件人郵箱地址
    email_password: "" # 發件人郵箱密碼或授權碼
    email_to: "" # 收件人郵箱地址，多個收件人用逗號分隔
    email_smtp_server: "" # SMTP服務器地址（可選，留空自動識別）
    email_smtp_port: "" # SMTP端口（可選，留空自動識別）
    ntfy_server_url: "https://ntfy.sh" # ntfy服務器地址，默認使用公共服務，可改爲自託管地址
    ntfy_topic: "" # ntfy主題名稱
    ntfy_token: "" # ntfy訪問令牌（可選，用於私有主題）
    bark_url: "" # Bark推送URL（格式：https://api.day.app/your_device_key 或自建服務器地址）
    slack_webhook_url: "" # Slack Incoming Webhook URL（格式：https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX）

# 用於讓關注度更高的新聞在更前面顯示，即用算法重新組合不同平臺的熱搜排序形成你側重的熱搜，合起來是 1 就行
weight:
  rank_weight: 0.6 # 排名權重
  frequency_weight: 0.3 # 頻次權重
  hotness_weight: 0.1 # 熱度權重

# name 可以定義任意名稱，只具有顯示作用，即使項目運行了幾天後，忽然改掉 name 也不會影響代碼的正常運行
platforms:
  - id: "udn"
    name: "UDN 聯合新聞網"
  - id: "udn_money"
    name: "UDN 理財網"
  - id: "yahoo_finance"
    name: "Yahoo Finance"
